name: Post to X

on:
  schedule:
    # GitHub cron is UTC. These are 8am, 12pm, 5pm, 9pm Pacific Standard Time.
    # During daylight time (Mar-Nov) they land one hour later; shift by -1h then.
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post next quote
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/post_x.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit queue + card
        run: |
          git config user.name "snoops-bot"
          git config user.email "snoops-bot@users.noreply.github.com"
          git add queue/queue.json docs/cards
          git diff --cached --quiet || (git commit -m "Posted to X" && git pull --rebase && git push)
