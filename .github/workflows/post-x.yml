name: Post to X

on:
  schedule:
    # GitHub cron is UTC and often runs late (sometimes hours), worst on the hour.
    # Slots are 8am, 12pm, 5pm, 9pm Pacific (PST). Each slot has a run at :03 and a
    # backup at :43. post_x.py never posts a quote before its slot time, and an
    # already-posted slot is skipped, so extra or late runs are safe.
    # During daylight time (Mar-Nov) shift every hour by -1.
    - cron: "3 16 * * *"
    - cron: "43 16 * * *"
    - cron: "3 20 * * *"
    - cron: "43 20 * * *"
    - cron: "3 1 * * *"
    - cron: "43 1 * * *"
    - cron: "3 5 * * *"
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post next quote
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/post_x.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit queue + card
        run: |
          git config user.name "snoops-bot"
          git config user.email "snoops-bot@users.noreply.github.com"
          git add queue/queue.json docs/cards
          git diff --cached --quiet || (git commit -m "Posted to X" && git pull --rebase && git push)
